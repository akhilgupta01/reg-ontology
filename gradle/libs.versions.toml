[versions]
# java: 26, not the newer 27 - Kotlin 2.4.21 (latest stable) doesn't emit
# bytecode for a JDK 27 target yet (falls back to JVM_26), which Gradle
# then rejects as a compileJava/compileKotlin target mismatch. 26 is the
# highest version Kotlin can currently target consistently; bump this once
# Kotlin adds JVM_27 support.
java = "26"
kotlin = "2.4.21"
spring-boot = "4.1.2"
spring-dependency-management = "1.1.7"
jena = "5.6.0"
commons-lang3 = "3.19.0"

[libraries]
# No version here: managed by the Spring Boot dependency-management plugin /
# the Kotlin Gradle plugin, same as before this catalog existed.
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
# Spring Boot 4.x defaults to Jackson 3.x, which relocated its Maven
# coordinates from com.fasterxml.jackson.* to tools.jackson.* - this is the
# Jackson-3-line Kotlin module (the old com.fasterxml.jackson.module one is
# Jackson 2.x and would pull in a second, incompatible Jackson alongside the
# one Spring Boot auto-configures).
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# Explicitly versioned: not covered by any BOM here.
jena-arq = { module = "org.apache.jena:jena-arq", version.ref = "jena" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
